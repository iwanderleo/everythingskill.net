name: Daily Stars Sync

on:
  schedule:
    # Run every day at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  sync-stars:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TARGET_BRANCH: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync GitHub stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-stars.mjs

      - name: Check archive status (auto-archive 404s / restore recovered repos)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-archived.mjs

      - name: Regenerate README files
        run: node scripts/generate-readme.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git add app/data/skills.json app/data/archived-skills.json app/data/skill-status-log.json README.md README_zh.md && git commit -m "chore: daily sync $(date -u +%Y-%m-%d)")

      - name: Push changes
        run: git push origin HEAD:${{ env.TARGET_BRANCH }}

      - name: Fast-forward merge to main
        run: |
          git fetch origin main
          git checkout main
          git merge --ff-only origin/${{ env.TARGET_BRANCH }}
          git push origin main
